<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Mother's Day</title>
  <style>
    body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
    .card-container { width: 340px; height: 480px; perspective: 1200px; cursor: pointer; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease; }
    .card.flipped { transform: rotateY(-180deg); }
    .front, .back { position: absolute; width: 100%; height: 100%; border-radius: 15px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .front { background: #fff5f5; color: #333; flex-direction: column; }
    .back { background: #fffaf0; transform: rotateY(180deg); color: #333; padding: 20px; text-align: center; flex-direction: column; }
    h1 { font-family: serif; color: #b05050; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card-container" onclick="this.querySelector('.card').classList.toggle('flipped')">
    <div class="card">
      <div class="front">
        <div style="font-size: 50px;">🌸</div>
        <h1>Happy Mother's Day</h1>
        <p style="color: #888;">Tap to open</p>
      </div>
      <div class="back">
        <h2 style="font-family: serif;">Mom,</h2>
        <p>Thank you for your love, your strength, and your endless support.</p>
        <p>I love you with all my heart.</p>
        <p><strong>Your son, Mark 💗</strong></p>
      </div>
    </div>
  </div>
</body>
</html>
